# Parser-Tests. Einschalten in .env:  COMPOSE_FILE=compose.yaml:compose.dev.yaml
services:
  app:
    build:
      args:
        DEV: "1"
    volumes:
      # Beispieldateien für Parser-Tests (nicht im Git, echte Personendaten)
      - ./samples:/app/samples:ro,Z
